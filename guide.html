<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>影逐 · 武学宝鉴</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

body {
  min-height: 100vh;
  font-family: 'Noto Serif SC', serif;
  color: #e8e0d0;
  background:
    radial-gradient(ellipse at 16% 90%, rgba(128, 44, 32, 0.22) 0%, transparent 55%),
    radial-gradient(ellipse at 86% 88%, rgba(58, 68, 128, 0.20) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 30%, rgba(66, 48, 66, 0.46) 0%, rgba(17, 13, 21, 0.80) 66%),
    linear-gradient(180deg, #191523 0%, #110e19 100%);
  background-attachment: fixed;
  display: flex;
  flex-direction: column;
  align-items: center;
}

a { color: #d4af37; text-decoration: none; }

/* ---------- 顶部 ---------- */
.wrap { width: 720px; max-width: 94vw; padding: 48px 0 60px; }

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 36px;
  font-size: 13px;
  color: #9a917d;
}

.hero { text-align: center; margin-bottom: 34px; }

.logo-seal {
  width: 54px; height: 54px;
  margin: 0 auto 14px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(160deg, #8c2b20, #5e1a12);
  border: 2px solid rgba(212, 175, 55, 0.55);
  border-radius: 10px;
  color: #f2e2b8;
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 30px;
  box-shadow: 0 4px 18px rgba(140, 43, 32, 0.45);
}

h1 {
  font-family: 'Ma Shan Zheng', cursive;
  font-weight: 400;
  font-size: 52px;
  letter-spacing: 6px;
  background: linear-gradient(180deg, #f5e7c4 0%, #d4af37 55%, #a9852e 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 2px 24px rgba(212, 175, 55, 0.25);
}

.slogan {
  margin-top: 8px;
  font-size: 14px;
  letter-spacing: 4px;
  color: #9a917d;
}

.divider {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  color: rgba(212, 175, 55, 0.6);
  font-size: 12px;
  margin: 18px auto 30px;
}
.divider::before, .divider::after {
  content: ''; height: 1px; width: 110px;
  background: linear-gradient(90deg, transparent, rgba(212,175,55,0.5));
}
.divider::after { background: linear-gradient(90deg, rgba(212,175,55,0.5), transparent); }

/* ---------- 搜索区 ---------- */
.search-box {
  display: flex;
  gap: 10px;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(212, 175, 55, 0.35);
  border-radius: 12px;
  padding: 10px;
}

.search-box input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: #f0e8d8;
  font-family: inherit;
  font-size: 16px;
  padding: 10px 12px;
  user-select: text;
}

.search-box input::placeholder { color: #6e6552; }

.search-btn {
  padding: 10px 26px;
  background: linear-gradient(160deg, #8c2b20, #5e1a12);
  color: #f2e2b8;
  border: 1px solid rgba(212, 175, 55, 0.45);
  border-radius: 8px;
  font-family: inherit;
  font-size: 15px;
  letter-spacing: 2px;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.search-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(140,43,32,0.4); }
.search-btn:disabled { opacity: 0.55; cursor: wait; transform: none; }

.chips {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-top: 14px;
}

.chip {
  font-size: 12.5px;
  color: #b0a58a;
  background: rgba(212, 175, 55, 0.07);
  border: 1px solid rgba(212, 175, 55, 0.22);
  border-radius: 999px;
  padding: 6px 14px;
  cursor: pointer;
  transition: all 0.15s;
}
.chip:hover { color: #d4af37; border-color: rgba(212,175,55,0.5); background: rgba(212,175,55,0.14); }

/* ---------- 结果 ---------- */
.status {
  min-height: 22px;
  margin: 26px 0 8px;
  text-align: center;
  font-size: 13px;
  color: #9a917d;
}

.result {
  background: linear-gradient(160deg, rgba(42,33,50,0.90) 0%, rgba(21,17,26,0.94) 100%);
  border: 1px solid rgba(212, 175, 55, 0.26);
  border-radius: 12px;
  padding: 18px 20px;
  margin-bottom: 14px;
  animation: rise 0.35s ease-out backwards;
}
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; } }

.r-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }

.r-title { font-size: 16.5px; font-weight: 700; color: #f0e2b8; }

.tag {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid;
  white-space: nowrap;
}
.tag.boss   { color: #e08b6a; border-color: rgba(224,139,106,0.5); }
.tag.skill  { color: #d4af37; border-color: rgba(212,175,55,0.5); }
.tag.guide  { color: #7dc8b8; border-color: rgba(125,200,184,0.5); }
.tag.faq    { color: #9aa8d8; border-color: rgba(154,168,216,0.5); }

.r-content { font-size: 14px; line-height: 1.8; color: #c8bfa8; }

.r-meter { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.r-meter-bar {
  flex: 1; height: 4px; border-radius: 2px;
  background: rgba(255,255,255,0.08);
  overflow: hidden;
}
.r-meter-fill {
  height: 100%;
  background: linear-gradient(90deg, #8c2b20, #d4af37);
  border-radius: 2px;
}
.r-meter-num { font-size: 12px; color: #9a917d; white-space: nowrap; }

.empty {
  text-align: center;
  padding: 40px 0;
  color: #6e6552;
  font-size: 14px;
}

/* ---------- 评论区 ---------- */
.cmt-toggle {
  margin-top: 10px;
  background: transparent;
  border: none;
  color: #9a917d;
  font-family: inherit;
  font-size: 12.5px;
  cursor: pointer;
  padding: 2px 0;
  transition: color 0.15s;
}
.cmt-toggle:hover { color: #d4af37; }

.cmt-panel {
  margin-top: 10px;
  border-top: 1px dashed rgba(212, 175, 55, 0.25);
  padding-top: 6px;
}

.cmt-item { padding: 9px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
.cmt-item:last-of-type { border-bottom: none; }
.cmt-meta { font-size: 11.5px; color: #8a7f68; margin-bottom: 3px; }
.cmt-text { font-size: 13px; line-height: 1.6; color: #c8bfa8; }

.cmt-form { display: flex; gap: 8px; margin-top: 10px; }
.cmt-input {
  background: rgba(0, 0, 0, 0.32);
  border: 1px solid rgba(212, 175, 55, 0.3);
  border-radius: 6px;
  padding: 7px 10px;
  color: #f0e8d8;
  font-family: inherit;
  font-size: 13px;
  outline: none;
  user-select: text;
}
.cmt-input:focus { border-color: rgba(212, 175, 55, 0.6); }
.cmt-nick { width: 108px; flex: none; }
.cmt-body { flex: 1; min-width: 0; }
.cmt-post {
  flex: none;
  padding: 7px 16px;
  background: rgba(212, 175, 55, 0.14);
  border: 1px solid rgba(212, 175, 55, 0.4);
  border-radius: 6px;
  color: #d4af37;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s;
}
.cmt-post:hover { background: rgba(212, 175, 55, 0.26); }
.cmt-msg { font-size: 12px; min-height: 16px; margin-top: 6px; color: #9a917d; }
.cmt-msg.err { color: #e07070; }

footer {
  margin-top: auto;
  padding: 26px 0 34px;
  text-align: center;
  font-size: 12px;
  color: #6e6552;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span>影逐 · 云端武库</span>
    <a href="./">← 返回游戏</a>
  </div>

  <div class="hero">
    <div class="logo-seal">鉴</div>
    <h1>武学宝鉴</h1>
    <div class="divider">❖</div>
    <div class="slogan">八境妖魔 · 弹反要诀 · 一问便知</div>
  </div>

  <div class="search-box">
    <input id="q" placeholder="输入问题，如：影尊怎么打？弹反怎么按？存档丢了怎么办？"
           autocomplete="off">
    <button class="search-btn" id="go">参 详</button>
  </div>

  <div class="chips" id="chips">
    <span class="chip" data-q="影尊怎么打">影尊怎么打</span>
    <span class="chip" data-q="完美格挡有什么用">完美格挡有什么用</span>
    <span class="chip" data-q="怎么提升攻击力">怎么提升攻击力</span>
    <span class="chip" data-q="连战模式规则">连战模式规则</span>
    <span class="chip" data-q="存档丢了怎么办">存档丢了怎么办</span>
    <span class="chip" data-q="皮肤在哪里买">皮肤在哪里买</span>
  </div>

  <div class="status" id="status"></div>
  <div id="results"></div>
</div>

<footer>影逐 · 武学宝鉴 —— 数据来自云端武库（pgvector 语义检索）<br>按 回车 或点「参详」检索</footer>

<script>
// ---------------- 配置 ----------------
const SUPABASE_URL = "https://abvmgpbtoljmrbdomaje.supabase.co";
const SUPABASE_KEY = "sb_publishable_GBlOiGtrp-7zqL9nRYEeYQ_d-FA6SxM";
// 可选：填入 Supabase Edge Function 地址后走真·向量检索；留空则用关键词检索
const EDGE_URL = "";

const TAG_NAME = { boss: "妖魔", skill: "武学", guide: "秘籍", faq: "问答" };

const $ = id => document.getElementById(id);
const qBox = $("q"), goBtn = $("go"), statusEl = $("status"), resultsEl = $("results");

async function api(path, opts = {}) {
  const res = await fetch(SUPABASE_URL + path, {
    ...opts,
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      ...(opts.headers || {})
    }
  });
  const text = await res.text();
  if (!res.ok) throw new Error("HTTP " + res.status + " " + text.slice(0, 120));
  // POST 插入成功时 Supabase 返回空响应体，不能强制 json()
  return text ? JSON.parse(text) : null;
}

function card(r, i) {
  const sim = typeof r.similarity === "number";
  const pct = sim ? Math.max(6, Math.min(100, r.similarity * 100)) : 0;
  const cat = (r.category || "faq").toLowerCase();
  const doc = esc(r.doc_id);
  return `<div class="result" style="animation-delay:${i * 0.06}s">
    <div class="r-head">
      <span class="r-title">${esc(r.title)}</span>
      <span class="tag ${cat}">${TAG_NAME[cat] || cat}</span>
    </div>
    <div class="r-content">${esc(r.content)}</div>
    ${sim ? `<div class="r-meter">
      <div class="r-meter-bar"><div class="r-meter-fill" style="width:${pct}%"></div></div>
      <div class="r-meter-num">契合度 ${(r.similarity * 100).toFixed(1)}%</div>
    </div>` : ""}
    <button class="cmt-toggle" data-doc="${doc}">💬 留言切磋</button>
    <div class="cmt-panel" id="cmt-${doc}" hidden></div>
  </div>`;
}

// ---------- 评论区 ----------
const cmtCooldown = {};

function timeAgo(iso) {
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return "刚刚";
  if (s < 3600) return Math.floor(s / 60) + " 分钟前";
  if (s < 86400) return Math.floor(s / 3600) + " 小时前";
  return Math.floor(s / 86400) + " 天前";
}

async function renderComments(docId, panel) {
  panel.innerHTML = '<div class="cmt-msg">加载留言中……</div>';
  try {
    const rows = await api("/rest/v1/comments?doc_id=eq." + encodeURIComponent(docId) +
      "&select=nickname,content,created_at&order=created_at.desc&limit=20");
    const list = rows.length
      ? rows.map(c =>
          `<div class="cmt-item">
            <div class="cmt-meta">${esc(c.nickname)} · ${timeAgo(c.created_at)}</div>
            <div class="cmt-text">${esc(c.content)}</div>
          </div>`).join("")
      : '<div class="cmt-msg">还没有留言，来当第一位侠客</div>';
    panel.innerHTML = list + `
      <div class="cmt-form">
        <input class="cmt-input cmt-nick" maxlength="12" placeholder="昵称（可留空）">
        <input class="cmt-input cmt-body" maxlength="150" placeholder="说点什么……">
        <button class="cmt-post">发送</button>
      </div>
      <div class="cmt-msg cmt-status"></div>`;
    panel.querySelector(".cmt-post").addEventListener("click",
      () => postComment(docId, panel));
    panel.querySelector(".cmt-body").addEventListener("keydown", e => {
      if (e.key === "Enter") postComment(docId, panel);
    });
  } catch (e) {
    panel.innerHTML = '<div class="cmt-msg err">留言加载失败：' + esc(e.message) + '</div>';
  }
}

function toggleComments(docId, panel) {
  if (panel.hidden) { panel.hidden = false; renderComments(docId, panel); }
  else panel.hidden = true;
}

async function postComment(docId, panel) {
  const nick = panel.querySelector(".cmt-nick").value.trim() || "无名侠客";
  const body = panel.querySelector(".cmt-body").value.trim();
  const st = panel.querySelector(".cmt-status");
  if (!body) { st.textContent = "先写点内容再发送"; st.classList.add("err"); return; }
  const now = Date.now();
  if (cmtCooldown[docId] && now - cmtCooldown[docId] < 15000) {
    st.textContent = "侠士慢行，稍候片刻再发";
    st.classList.add("err"); return;
  }
  cmtCooldown[docId] = now;
  try {
    await api("/rest/v1/comments", {
      method: "POST",
      body: JSON.stringify({ doc_id: docId, nickname: nick.slice(0, 12), content: body.slice(0, 150) })
    });
    st.classList.remove("err");
    renderComments(docId, panel);
  } catch (e) {
    st.textContent = "发送失败：" + e.message;
    st.classList.add("err");
  }
}

resultsEl.addEventListener("click", e => {
  const btn = e.target.closest(".cmt-toggle");
  if (!btn) return;
  const panel = document.getElementById("cmt-" + btn.dataset.doc);
  if (panel) toggleComments(btn.dataset.doc, panel);
});

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ---------- 分词计分检索（整句也能搜） ----------
const STOP = new Set(["怎么", "什么", "为什么", "怎么办", "如何", "哪里", "哪个", "哪些",
  "可以", "是不是", "有没有", "应该", "还是", "这样", "的话", "一下", "时候", "各种",
  "进行", "出现", "或者", "以及", "然后", "但是", "所以", "如果", "大家", "我们"]);

function tokenize(q) {
  const out = new Set();
  if (q.length >= 2 && !STOP.has(q)) out.add(q);
  for (let i = 0; i < q.length - 1; i++) {
    const b = q.slice(i, i + 2);
    if (!STOP.has(b)) out.add(b);
  }
  return [...out].slice(0, 10);
}

function scoreRows(rows, toks) {
  return rows.map(r => {
    let s = 0;
    for (const t of toks) {
      if (r.title.includes(t)) s += 3;
      if (r.content.includes(t)) s += 1;
    }
    return { ...r, score: s };
  })
  .filter(r => r.score > 0)
  .sort((a, b) => b.score - a.score)
  .slice(0, 6);
}

async function search() {
  const q = qBox.value.trim();
  if (!q) { statusEl.textContent = "先写下你的疑问"; return; }
  goBtn.disabled = true;
  statusEl.textContent = "翻检武库中……";
  resultsEl.innerHTML = "";
  try {
    let rows;
    if (EDGE_URL) {
      // 真·向量检索（需已部署 Edge Function）
      const res = await fetch(EDGE_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: q, k: 5 })
      });
      rows = await res.json();
    } else {
      // 分词多路匹配：把整句拆成词块，任一命中即入围，按命中强度排序
      const toks = tokenize(q);
      const cond = toks.map(t =>
        `title.ilike.*${encodeURIComponent(t)}*,content.ilike.*${encodeURIComponent(t)}*`
      ).join(",");
      rows = await api("/rest/v1/game_knowledge" +
        `?or=(${cond})&select=doc_id,title,content,category&limit=50`);
      rows = scoreRows(rows, toks);
      // 归一化为契合度用于展示
      const max = Math.max(...rows.map(r => r.score), 1);
      rows.forEach(r => { r.similarity = Math.min(0.95, r.score / max * 0.95); });
    }
    if (rows && rows.length) {
      statusEl.textContent = `寻得 ${rows.length} 部秘籍`;
      resultsEl.innerHTML = rows.map(card).join("");
    } else {
      statusEl.textContent = "武库中暂无记载，换个问法试试";
      resultsEl.innerHTML = `<div class="empty">—— 暂无相关记载 ——</div>`;
    }
  } catch (e) {
    statusEl.textContent = "检索失败：" + e.message;
  } finally {
    goBtn.disabled = false;
  }
}

goBtn.addEventListener("click", search);
qBox.addEventListener("keydown", e => { if (e.key === "Enter") search(); });
document.getElementById("chips").addEventListener("click", e => {
  if (e.target.classList.contains("chip")) {
    qBox.value = e.target.dataset.q;
    search();
  }
});
qBox.focus();
</script>
</body>
</html>
